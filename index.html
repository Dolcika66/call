<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>اتصال</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; display: flex;
         flex-direction: column; align-items: center; justify-content: center; background: #e8f5ee; }
  p { font-size: 24px; color: #123; direction: ltr; }
  a.btn { display: block; background: #118c4f; color: #fff; font-size: 26px; text-decoration: none;
          padding: 22px 44px; border-radius: 16px; margin-top: 16px; }
</style>
</head>
<body>
<p id="shown"></p>
<a class="btn" id="call" href="#">📞 اتصل الآن</a>
<script>
  var raw = (new URLSearchParams(location.search).get('n') || '').replace(/\D/g, '');
  if (raw) {
    var tel = '+20' + raw.slice(-10);
    document.getElementById('shown').textContent = '0' + raw.slice(-10);
    document.getElementById('call').href = 'tel:' + tel;
    setTimeout(function () { location.href = 'tel:' + tel; }, 300);
  } else {
    document.getElementById('shown').textContent = 'مفيش رقم';
    document.getElementById('call').style.display = 'none';
  }
</script>
</body>
</html>
